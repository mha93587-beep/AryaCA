name: AryaCA Daily Current Affairs Automated Dispatch (6:45 AM IST)

# 01:15 UTC = 06:45 AM IST
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      question_count:
        description: 'Number of MCQs to curate (default: 50)'
        required: false
        default: '50'
      date:
        description: 'Date override (YYYY-MM-DD, optional)'
        required: false
        default: ''
      dry_run:
        description: 'Test run (Dry Run - no Telegram spam)'
        type: boolean
        required: false
        default: false

concurrency:
  group: aryaca-daily-pipeline
  cancel-in-progress: false

jobs:
  daily_dispatch:
    name: Generate & Broadcast Daily Edition
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: 'Asia/Kolkata'
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      APIFY_API_KEYS: ${{ secrets.APIFY_API_KEYS }}
      APIFY_API: ${{ secrets.APIFY_API }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHANNEL_CHAT_IDS: ${{ secrets.TG_CHANNEL_CHAT_IDS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAND_NAME: 'AryaCA'
      CHANNEL_HANDLE: '@AryaCAtg'
      CHANNEL_URL: 'https://t.me/AryaCAtg'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Linux System Dependencies (WeasyPrint & Poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libfontconfig1 \
            poppler-utils \
            fonts-deva \
            fonts-noto-extra \
            fonts-noto-core \
            fonts-noto-cjk

      - name: 🐍 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Autonomous Daily Pipeline
        run: |
          COUNT="${{ inputs.question_count || '50' }}"
          EXTRA_ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --date ${{ inputs.date }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          echo "Running AryaCA automated scheduler at $(date)..."
          python3 scheduler.py --count "$COUNT" $EXTRA_ARGS

      - name: 💾 Archive Generated PDF & Preview Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AryaCA-Daily-Output-${{ github.run_id }}
          path: |
            outputs/*.pdf
            outputs/*.png
          retention-days: 7
