name: Daily Current Affairs Automated Dispatch

run-name: "Current Affairs [${{ inputs.brand || 'affairs_index' }}] Shift ${{ inputs.shift || 'Auto' }} (${{ inputs.date || 'Today' }})"

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      brand:
        description: 'Select Brand (affairs_index, aryaca, or all)'
        required: true
        type: choice
        options:
          - 'affairs_index'
          - 'aryaca'
          - 'all'
        default: 'affairs_index'
      question_count:
        description: 'Number of MCQs to curate (default: 50)'
        required: false
        default: '50'
      shift:
        description: 'Shift number override (optional: 1, 2, 3... auto-detected if empty)'
        required: false
        default: ''
      date:
        description: 'Date override (YYYY-MM-DD, optional)'
        required: false
        default: ''
      dry_run:
        description: 'Test run (Dry Run - no Telegram broadcast)'
        type: boolean
        required: false
        default: false

concurrency:
  group: ca-daily-pipeline-${{ inputs.brand || 'default' }}
  cancel-in-progress: false

jobs:
  daily_dispatch:
    name: Generate & Broadcast Daily Edition
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: 'Asia/Kolkata'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      APIFY_API_KEYS: ${{ secrets.APIFY_API_KEYS }}
      APIFY_API: ${{ secrets.APIFY_API }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHANNEL_CHAT_IDS: ${{ secrets.TG_CHANNEL_CHAT_IDS }}
      ARYA_CHANNEL_CHAT_IDS: ${{ secrets.ARYA_CHANNEL_CHAT_IDS }}
      AFFAIRS_INDEX_CHANNEL_CHAT_IDS: ${{ secrets.AFFAIRS_INDEX_CHANNEL_CHAT_IDS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Linux System Dependencies (WeasyPrint & Poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libfontconfig1 \
            poppler-utils \
            fonts-deva \
            fonts-noto-extra \
            fonts-noto-core \
            fonts-noto-cjk

      - name: 🐍 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Autonomous Daily Pipeline
        run: |
          BRAND="${{ inputs.brand || 'affairs_index' }}"
          COUNT="${{ inputs.question_count || '50' }}"
          EXTRA_ARGS="--brand $BRAND"
          if [ -n "${{ inputs.shift }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --shift ${{ inputs.shift }}"
          fi
          if [ -n "${{ inputs.date }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --date ${{ inputs.date }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          echo "Running Current Affairs automated scheduler for brand [$BRAND] at $(date)..."
          python3 scheduler.py --count "$COUNT" $EXTRA_ARGS

      - name: 💾 Archive Generated PDF & Preview Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Current-Affairs-Output-${{ github.run_id }}
          path: |
            outputs/*.pdf
            outputs/*.png
          retention-days: 7
